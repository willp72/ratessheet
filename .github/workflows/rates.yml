name: Savings rates

on:
  schedule:
    # 05:30 UTC daily: 06:30 BST in summer, 05:30 GMT in winter. Hours ahead of
    # the Apps Script email trigger at 09:00, so a queue delay cannot race it.
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      # Where is this runner? HL serves it a reduced page, and if the answer
      # is "not the UK" that points at geo-gating rather than anything in the
      # scraper. Costs nothing and settles the question.
      - name: Runner location
        run: curl -s https://ipinfo.io/json || true

      - name: Collect rates
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DEBUG_DIR: debug
        run: python rates.py

      # The page HL serves the runner, kept so it can be compared against what
      # a browser in the UK sees. Download it from the run's Artifacts section.
      - name: Upload fetched pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-pages
          path: debug/
          retention-days: 7
          if-no-files-found: ignore
