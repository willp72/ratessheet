name: Savings rates

on:
  schedule:
    # Two runs, both well before the 09:00 email. If the first fails or does
    # not fire, the second still writes fresh figures and the email is clean.
    - cron: "30 5 * * *"    # 05:30 UTC
    - cron: "15 7 * * *"    # 07:15 UTC, backup
  workflow_dispatch:

# A backup run starting while the first is still going would race the sheet.
concurrency:
  group: savings-rates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Runner location
        run: curl -s https://ipinfo.io/json || true

      # Three attempts. Most failures here are a site being slow or a browser
      # step timing out, and those rarely repeat back to back.
      - name: Collect rates
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DEBUG_DIR: debug
        run: |
          for attempt in 1 2 3; do
            echo "=== attempt $attempt ==="
            if python rates.py; then
              echo "=== attempt $attempt succeeded ==="
              exit 0
            fi
            echo "=== attempt $attempt failed ==="
            sleep 30
          done
          echo "All three attempts failed."
          exit 1

      - name: Upload fetched pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-pages
          path: debug/
          retention-days: 7
          if-no-files-found: ignore
