name: Savings rates

on:
  schedule:
    # 05:30 UTC daily: 06:30 BST in summer, 05:30 GMT in winter.
    #
    # Plain UTC with no timezone field, because that field is not reliably
    # accepted and a rejected schedule fails silently: the manual button still
    # works, so nothing looks broken until the email arrives marked [STALE].
    #
    # The exact hour does not matter as long as it is hours ahead of the
    # Apps Script email trigger at 09:00. Scheduled runs routinely slip 5 to 30
    # minutes, so the gap has to absorb that, not just the 4 minute runtime.
    - cron: "30 5 * * *"
  workflow_dispatch:          # manual "Run workflow" button

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Collect rates
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python rates.py
